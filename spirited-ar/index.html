<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Spirited Away AR</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
} }
</script>
</head>
<body>
  <div id="stage"></div>

  <!-- Start screen -->
  <section id="start" class="overlay">
    <h1>千と千尋の神隠し</h1>
    <p class="sub">Spirited Away · AR poster</p>
    <p>Allow the camera, then point it at the framed poster. Move your phone up, down, left and right to explore the world around the frame.</p>
    <button id="btnStart">Start AR</button>
    <button id="btnPreview" class="ghost">Preview without camera</button>
  </section>

  <section id="loading" class="overlay hidden"><div class="spinner"></div><p id="loadMsg">Loading…</p></section>

  <div id="hint" class="hint hidden">Point the camera at the poster</div>
  <div id="error" class="overlay hidden"><p id="errMsg"></p><button onclick="location.reload()">Try again</button></div>

  <script type="module" src="app.js"></script>
</body>
</html>
