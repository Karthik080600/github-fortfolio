<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Enter the Spirit World</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
:root{--ink:#0b1330;--gold:#f2b84b;--red:#c8372d;--cream:#f6e9cf}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--ink);color:var(--cream);font-family:'Shippori Mincho',Georgia,serif;overflow:hidden}
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;padding:8vh 8vw calc(8vh + env(safe-area-inset-bottom));background:radial-gradient(circle at 70% 25%,#a8321f 0,#3a1a3f 38%,var(--ink) 75%)}
#intro h1{font-weight:800;font-size:clamp(2.6rem,13vw,5rem);line-height:.95;margin:0 0 1rem;letter-spacing:.02em;text-shadow:0 0 28px #f2b84b66}
#intro p{max-width:30ch;margin:0 0 2rem;line-height:1.5;opacity:.9}
button{font:inherit;color:var(--cream);background:#0b133099;border:1px solid var(--gold);border-radius:999px;padding:.7rem 1.2rem;backdrop-filter:blur(6px)}
#go{background:var(--gold);color:var(--ink);font-weight:800;font-size:1.1rem;padding:1rem 1.6rem;align-self:flex-start;border:0}
#hud{position:fixed;z-index:10;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:none;justify-content:space-between;gap:8px;pointer-events:none}
#hud>*{pointer-events:auto}
#status{background:#0b1330b0;padding:.5rem .9rem;border-radius:999px;font-size:.85rem;align-self:flex-start}
#ctl{display:flex;gap:8px;align-items:center}
#vol{width:84px;accent-color:var(--gold)}
#zones{position:fixed;z-index:10;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;display:none;justify-content:center;gap:6px}
#zones button{padding:.5rem .8rem;font-size:.8rem}
#msg{position:fixed;z-index:15;left:6vw;right:6vw;bottom:20vh;text-align:center;font-size:1.05rem;text-shadow:0 1px 8px #000;display:none}
#err{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:10vw;text-align:center;background:var(--ink);line-height:1.5}
a-scene{position:fixed;inset:0}
</style></head><body>
<div id="intro"><h1>ENTER THE<br>SPIRIT WORLD</h1><p>Point your phone at the poster. Turn around to explore. Listen as you look.</p><button id="go">START EXPERIENCE</button></div>
<div id="hud"><div id="status">Starting camera…</div><div id="ctl"><input id="vol" type="range" min="0" max="1" step=".05" value=".8" aria-label="Volume"><button id="mute">Mute</button><button id="reset">Reset</button><button id="exit">Exit</button></div></div>
<div id="msg">Point your camera at the poster</div>
<div id="zones"></div>
<div id="err"></div>
<a-scene id="scene" mindar-image="imageTargetSrc:./assets/targets.mind;autoStart:false;uiLoading:no;uiScanning:no;uiError:no;filterMinCF:.0005;filterBeta:.01" color-space="sRGB" renderer="colorManagement:true;alpha:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
<a-camera position="0 0 0" look-controls="enabled:false" wasd-controls="enabled:false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex:0"></a-entity>
<a-entity id="world"></a-entity>
</a-scene>
<script src="js/app.js"></script>
</body></html>
